<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Card/Glow Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCardReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes waveMove {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0px); }
    }

    .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .flow-line { stroke: url(#primaryGlow); stroke-width: 2; stroke-dasharray: 8, 8; animation: dashFlow 8s linear infinite; }
    .node-pulse { animation: pulseNode 4s ease-in-out infinite; transform-origin: center; }
    .card-float-1 { animation: floatCard 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCardReverse 7s ease-in-out infinite; }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
    .sub-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; fill: #cbd5e1; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Decorative Grid Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>

    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="200" cy="200" r="180" fill="#4f46e5" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="1000" cy="180" r="200" fill="#ec4899" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Animated Data Flow Lines (Dynamic Layer - Background to Text) -->
  <path d="M 100 320 C 300 380, 500 280, 700 340 C 900 400, 1050 300, 1150 320" fill="none" class="flow-line" opacity="0.6"/>
  <path d="M 50 80 C 250 20, 450 120, 750 40 C 950 -20, 1100 80, 1180 50" fill="none" class="flow-line" opacity="0.4"/>

  <!-- Dynamic Floating Cards / Technology Pills (Positioned around text, low opacity background elements) -->
  <g class="card-float-1" opacity="0.85">
    <!-- Cloud Sync Pill -->
    <rect x="70" y="55" width="160" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
    <circle cx="92" cy="74" r="6" fill="#818cf8" class="node-pulse"/>
    <text x="108" y="79" class="badge-text">☁️ Private Cloud</text>
  </g>

  <g class="card-float-2" opacity="0.85">
    <!-- End-to-End Encryption Pill -->
    <rect x="960" y="60" width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1.5"/>
    <circle cx="982" cy="79" r="6" fill="#f472b6" class="node-pulse"/>
    <text x="998" y="84" class="badge-text">🔒 E2E Encrypted</text>
  </g>

  <g class="card-float-2" opacity="0.8">
    <!-- Zero Trust Sync Pill -->
    <rect x="80" y="310" width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
    <circle cx="102" cy="329" r="6" fill="#c084fc" class="node-pulse"/>
    <text x="118" y="334" class="badge-text">🔄 P2P & Active Sync</text>
  </g>

  <g class="card-float-1" opacity="0.85">
    <!-- Governance & Compliance Pill -->
    <rect x="940" y="305" width="190" height="38" rx="19" fill="url(#cardGrad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5"/>
    <circle cx="962" cy="324" r="6" fill="#34d399" class="node-pulse"/>
    <text x="978" y="329" class="badge-text">🛡️ Open Governance</text>
  </g>

  <!-- Dark Semi-Transparent High-Contrast Backdrop for Foreground Text -->
  <rect x="180" y="110" width="840" height="180" rx="20" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#glow)"/>

  <!-- Foreground Title and Subtitle (Guaranteed High Contrast & Foreground Visibility) -->
  <g text-anchor="middle">
    <!-- Main Header -->
    <text x="600" y="175" class="title-text" font-size="40" letter-spacing="-0.5">
      Awesome Enterprise File Sync &amp; Share
    </text>

    <!-- Subtitle Banner Pills -->
    <text x="600" y="218" class="sub-text" font-size="18" fill="#94a3b8">
      A Curated Ecosystem of SaaS Platforms &amp; Open-Source EFSS Solutions
    </text>

    <!-- Highlight Tagline -->
    <rect x="360" y="242" width="480" height="30" rx="15" fill="url(#primaryGlow)" opacity="0.9"/>
    <text x="600" y="262" font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" letter-spacing="0.5">
      SECURE FILE SYNC • CONTENT GOVERNANCE • PRIVATE CLOUD
    </text>
  </g>
</svg>
