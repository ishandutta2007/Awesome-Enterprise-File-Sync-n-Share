<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Primary Accent Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatCardAlt {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }

    .grid-line { stroke: #ffffff; stroke-opacity: 0.05; stroke-width: 1; }
    .flow-path { stroke: url(#primaryGlow); stroke-width: 2; stroke-dasharray: 8 8; animation: dashFlow 6s linear infinite; }
    .card-node-1 { animation: floatCard 5s ease-in-out infinite; }
    .card-node-2 { animation: floatCardAlt 6s ease-in-out infinite; }
    .pulse-dot { animation: pulseNode 3s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Base Container Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Decorative Grid Lines -->
  <g>
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line"/>
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line"/>
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line"/>
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line"/>

    <line x1="150" y1="0" x2="150" y2="400" class="grid-line"/>
    <line x1="300" y1="0" x2="300" y2="400" class="grid-line"/>
    <line x1="450" y1="0" x2="450" y2="400" class="grid-line"/>
    <line x1="600" y1="0" x2="600" y2="400" class="grid-line"/>
    <line x1="750" y1="0" x2="750" y2="400" class="grid-line"/>
    <line x1="900" y1="0" x2="900" y2="400" class="grid-line"/>
    <line x1="1050" y1="0" x2="1050" y2="400" class="grid-line"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="200" r="160" fill="#4f46e5" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="1000" cy="200" r="160" fill="#ec4899" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Animated Dynamic Data Streams -->
  <path d="M 80 320 Q 350 390 650 330 T 1120 310" fill="none" class="flow-path" opacity="0.6"/>
  <path d="M 60 70 Q 300 20 600 80 T 1140 60" fill="none" class="flow-path" opacity="0.4"/>

  <!-- Dynamic Feature Badges (Background Layer) -->
  <g class="card-node-1">
    <rect x="70" y="55" width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="92" cy="74" r="5" fill="#818cf8" class="pulse-dot"/>
    <text x="108" y="79" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">Private Cloud Sync</text>
  </g>

  <g class="card-node-2">
    <rect x="960" y="60" width="170" height="38" rx="19" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="982" cy="79" r="5" fill="#f472b6" class="pulse-dot"/>
    <text x="998" y="84" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">End-to-End Encrypted</text>
  </g>

  <g class="card-node-2">
    <rect x="70" y="305" width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="92" cy="324" r="5" fill="#c084fc" class="pulse-dot"/>
    <text x="108" y="329" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">P2P &amp; Edge Sync</text>
  </g>

  <g class="card-node-1">
    <rect x="950" y="305" width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="972" cy="324" r="5" fill="#34d399" class="pulse-dot"/>
    <text x="988" y="329" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">Open Governance</text>
  </g>

  <!-- Foreground Backdrop Panel (Ensures High Contrast & Readability) -->
  <rect x="180" y="110" width="840" height="180" rx="20" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Main Header -->
    <text x="600" y="175" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="38" fill="#ffffff" letter-spacing="-0.5">
      Awesome Enterprise File Sync &amp; Share
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="17" fill="#94a3b8">
      Curated Commercial SaaS Platforms &amp; Open-Source EFSS Solutions
    </text>

    <!-- Tagline Badge -->
    <rect x="360" y="242" width="480" height="30" rx="15" fill="url(#primaryGlow)" fill-opacity="0.95"/>
    <text x="600" y="262" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#ffffff" letter-spacing="1">
      SECURE FILE SYNC • CONTENT GOVERNANCE • PRIVATE CLOUD
    </text>
  </g>
</svg>
